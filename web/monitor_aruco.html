<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop Monitor ArUco Target Surface</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  
  /* Corner Markers (Default 2.2 inches ~ 210px, adjustable > 1.5 inches) */
  .marker-corner {
    position: absolute;
    width: var(--tag-size, 220px);
    height: var(--tag-size, 220px);
    z-index: 10;
    transition: width 0.15s ease, height 0.15s ease, top 0.15s ease, bottom 0.15s ease, left 0.15s ease, right 0.15s ease;
  }
  .marker-corner img {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  
  #corner-tl {
    top: var(--tag-margin, 20px);
    left: var(--tag-margin, 20px);
  }
  #corner-tr {
    top: var(--tag-margin, 20px);
    right: var(--tag-margin, 20px);
  }
  #corner-bl {
    bottom: var(--tag-margin, 20px);
    left: var(--tag-margin, 20px);
  }
  #corner-br {
    bottom: var(--tag-margin, 20px);
    right: var(--tag-margin, 20px);
  }


  /* Interactive Shockwave Flash */
  .shockwave {
    position: absolute;
    border-radius: 50%;
    border: 6px solid #ff2200;
    pointer-events: none;
    animation: explode 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes explode {
    0% { width: 20px; height: 20px; opacity: 1; transform: translate(-50%, -50%); }
    100% { width: 280px; height: 280px; opacity: 0; transform: translate(-50%, -50%); }
  }

  /* Floating Control Toolbar */
  .toolbar {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 25, 0.88);
    backdrop-filter: blur(12px);
    color: white;
    padding: 12px 26px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 13px;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .toolbar.hidden {
    opacity: 0;
    transform: translate(-50%, 20px);
    pointer-events: none;
  }
  .toolbar label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .toolbar input[type="range"] {
    cursor: pointer;
  }
  .btn {
    background: #3388ff;
    color: white;
    border: none;
    padding: 7px 16px;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    transition: background 0.15s;
  }
  .btn:hover { background: #1a6fe6; }
  
  .hint {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    padding: 6px 18px;
    border-radius: 12px;
    font-size: 12px;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 50;
  }
</style>
</head>

  const sizeSlider = document.getElementById('sizeSlider');
  const sizeLabel = document.getElementById('sizeLabel');
  const marginSlider = document.getElementById('marginSlider');
  const marginLabel = document.getElementById('marginLabel');
  const mappingSelect = document.getElementById('mappingSelect');
  const toolbar = document.getElementById('toolbar');
  const hint = document.getElementById('hint');
  const fsBtn = document.getElementById('fsBtn');

  // Tag Size Slider (> 1.5 inches up to 3.6 inches)
  sizeSlider.addEventListener('input', (e) => {
    const px = e.target.value;
    const inch = (px / 96).toFixed(1);
    document.documentElement.style.setProperty('--tag-size', px + 'px');
    sizeLabel.textContent = `${inch}" (${px}px)`;
  });

  // Margin Slider
  marginSlider.addEventListener('input', (e) => {
    const px = e.target.value;
    document.documentElement.style.setProperty('--tag-margin', px + 'px');
    marginLabel.textContent = px + 'px';
  });


  // Corner Mapping Preset
  mappingSelect.addEventListener('change', (e) => {
    if (e.target.value === 'whiteboard') {
      document.getElementById('img-tl').src = markers[3];
      document.getElementById('img-tr').src = markers[2];
      document.getElementById('img-bl').src = markers[0];
      document.getElementById('img-br').src = markers[1];
    } else {
      document.getElementById('img-tl').src = markers[0];
      document.getElementById('img-tr').src = markers[1];
      document.getElementById('img-bl').src = markers[3];
      document.getElementById('img-br').src = markers[2];
    }
  });

  // Fullscreen
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {});
    } else {
      document.exitFullscreen();
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);
  window.addEventListener('dblclick', toggleFullscreen);

  // Click to trigger visual impact ripple
  window.addEventListener('click', (e) => {
    if (e.target.closest('#toolbar')) return;
    const ripple = document.createElement('div');
    ripple.className = 'shockwave';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  // Auto-hide toolbar after 3.5 seconds of mouse idle
  let hideTimeout;
  function resetIdle() {
    toolbar.classList.remove('hidden');
    hint.style.opacity = '1';
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      toolbar.classList.add('hidden');
      hint.style.opacity = '0';
    }, 3500);
  }
  window.addEventListener('mousemove', resetIdle);
  resetIdle();
